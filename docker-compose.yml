version: "3.7"

services:
  2maps:
    image: ghcr.io/mikhail-angelov/2maps/2maps:latest
    container_name: "2maps"
    restart: unless-stopped
    networks:
      - webnet
    ports:
      - "127.0.0.1:3001:3000"
    labels:
      monic.enabled: "true"
      monic.check: "http"
      monic.check_http_url: "https://2maps.xyz"
      monic.name: "2maps"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    env_file:
      - .env
    command: npm start
    volumes:
      - ./data:/opt/app/data:rw
